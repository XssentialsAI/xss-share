<!DOCTYPE html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>AI-Native Xssentials plan</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            /* Xssentials brand gate — warm charcoal page, cream card, single orange accent.
               Palette per 60-System memory reference-xssentials-brand-colors:
               orange #F18A20 · ink #1F1D1B · muted #8C857B · cream #FAF7F2 · paper #FFFDFA
               · lines #E7E0D6 · warm charcoal #26231F. Deliberately single-accent. */
            :root {
                --xss-orange: #f18a20;
                --xss-ink: #1f1d1b;
                --xss-ink-soft: #4a4640;
                --xss-muted: #8c857b;
                --xss-cream: #faf7f2;
                --xss-paper: #fffdfa;
                --xss-line: #e7e0d6;
                --xss-charcoal: #26231f;
            }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                min-height: 100%;
                background: var(--xss-charcoal);
                font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 32px 20px 48px;
                box-sizing: border-box;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 380px;
            }

            .xss-logo {
                display: block;
                width: 156px;
                height: auto;
                margin: 0 auto 30px;
            }

            .staticrypt-form {
                background: var(--xss-paper);
                border-radius: 3px;
                padding: 34px 30px 30px;
                box-shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
                text-align: left;
            }

            .staticrypt-instructions p {
                font-size: 0.8125rem;
                line-height: 1.5;
                color: var(--xss-muted);
                margin: 0;
            }

            /* Must out-specify `.staticrypt-instructions p` above (0,1,1) — the title is
               a <p> inside that block, so a bare `.staticrypt-title` (0,1,0) loses and
               the heading renders muted grey. */
            .staticrypt-instructions p.staticrypt-title {
                font-size: 1.125rem;
                font-weight: 600;
                color: var(--xss-ink);
                letter-spacing: 0.005em;
                margin: 0 0 5px;
            }

            .staticrypt-hr {
                border: 0;
                border-top: 1px solid var(--xss-line);
                margin: 20px 0;
            }

            .staticrypt-password-container {
                position: relative;
                margin: 0 0 14px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: var(--xss-cream);
                border: 1px solid var(--xss-line);
                border-radius: 2px;
                box-sizing: border-box;
                color: var(--xss-ink);
                font-family: inherit;
                font-size: 0.9375rem;
                outline: 0;
                padding: 13px 44px 13px 13px;
                width: 100%;
                transition: border-color 0.12s ease, box-shadow 0.12s ease;
            }

            .staticrypt-form input[type="password"]::placeholder,
            .staticrypt-form input[type="text"]::placeholder {
                color: var(--xss-muted);
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--xss-orange);
                box-shadow: 0 0 0 3px rgba(241, 138, 32, 0.16);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.42;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
            }

            .staticrypt-toggle-password-visibility:hover {
                opacity: 0.7;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                font-size: 0.8125rem;
                color: var(--xss-ink-soft);
                margin: 0 0 14px;
                cursor: pointer;
            }

            .staticrypt-remember input[type="checkbox"] {
                accent-color: var(--xss-orange);
                margin: 0 9px 0 0;
                transform: scale(1.15);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                background: var(--xss-orange);
                border: 0;
                border-radius: 2px;
                color: #ffffff;
                cursor: pointer;
                font-family: inherit;
                font-size: 0.75rem;
                font-weight: 600;
                letter-spacing: 0.11em;
                outline: 0;
                padding: 14px;
                text-transform: uppercase;
                width: 100%;
                transition: filter 0.12s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active {
                filter: brightness(93%);
            }

            .staticrypt-form .staticrypt-decrypt-button:focus-visible {
                box-shadow: 0 0 0 3px rgba(241, 138, 32, 0.35);
            }

            /* Inline error instead of a native alert() — an OS dialog is the least
               branded element a page can show, and it blocks the whole tab. */
            .xss-error {
                background: #fdf1ef;
                border-left: 3px solid #b91c1c;
                color: #b91c1c;
                font-size: 0.8125rem;
                line-height: 1.4;
                margin: 0 0 14px;
                padding: 9px 11px;
            }

            .xss-footer {
                color: rgba(250, 247, 242, 0.34);
                font-size: 0.6875rem;
                letter-spacing: 0.06em;
                margin: 22px 0 0;
                text-align: center;
                text-transform: uppercase;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                align-items: center;
                background: var(--xss-charcoal);
                display: flex;
                height: 100%;
                justify-content: center;
            }

            .staticrypt-spinner {
                animation: spinner-border 0.75s linear infinite;
                border: 0.2em solid rgba(250, 247, 242, 0.22);
                border-radius: 50%;
                border-right-color: var(--xss-orange);
                display: inline-block;
                height: 2rem;
                width: 2rem;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            /* iOS zooms the page when a focused input is under 16px. */
            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>

                    toggleIcon.src = imgSrcEyeClosed;
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });

            // handle password form submission
            const errorBox = document.getElementById("xss-error");

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                errorBox.classList.add("hidden");

                const password = document.getElementById("staticrypt-password").value,
                    isRememberChecked = document.getElementById("staticrypt-remember").checked;

                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

                if (!isSuccessful) {
                    errorBox.textContent = templateError;
                    errorBox.classList.remove("hidden");
                    const passwordInput = document.getElementById("staticrypt-password");
                    passwordInput.select();
                    passwordInput.focus();
                }
            });
        </script>
    </body>
</html>
